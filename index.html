  .dragon{display:block;font-size:14px;letter-spacing:10px;margin-top:6px;color:#d4af37;opacity:.85}

function _bytesToHex(b){ let s=""; for(let i=0;i<b.length;i++) s+=("0"+b[i].toString(16)).slice(-2); return s; }
const _K=[1116352408,1899447441,3049323471,3921009574,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1915078388,2166482820,3203998086,2732408916,4194580999,2273298018,1959290236,2023344822,645713713,4094104258,1272893353,4139463444,1126891411,2887873275,2273961513,3878444813,1839030562,4124245431,1309481646,4235799232,1763290256,1509159560,1028605311,1231456001,1390939755,1112624098,555781218,2385914851,1835215356,1418833926,1859105616,1416259873,1066497531,808182768,1067700121,1794305478,1886516468,1428411237,2322348311,1345470996,871428502,1150626363,1965094481,1409808976,1772157897,1530332063,1314254366,452827953,2056179779,439757063,2272839284,807037137,1921251022,1274624521,3354120932,1648399861,1425494383,1990831929,1384394983,979502131,1388972751,1934736161];
function _R(x,n){ return (x>>>n)|(x<<(32-n)); }
function _sha256(data){
  const l=data.length*8, o=((l>>>5)+1)<<2, pad=new Uint8Array((o+64)>>>2<<2);
  pad.set(data);
  const v=new DataView(pad.buffer);
  v.setUint32(o, l>>>0); v.setUint32(o+4, 0);
  const H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225], W=new Int32Array(64);
  for(let i=0;i<pad.length;i+=64){
    for(let t=0;t<16;t++) W[t]=v.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=_R(W[t-15],7)^_R(W[t-15],18)^(W[t-15]>>>3), s1=_R(W[t-2],17)^_R(W[t-2],19)^(W[t-2]>>>10);
      W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=_R(e,6)^_R(e,11)^_R(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+_K[t]+W[t])>>>0;
      const S0=_R(a,2)^_R(a,13)^_R(a,22), maj=(a&b)^(a&c)^(b&c), t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out=new Uint8Array(32), ov=new DataView(out.buffer);
  for(let i=0;i<8;i++) ov.setUint32(i*4,H[i]);
  return out;
}
function _hmac(key,data){
  const BLOCK=64; let k=new Uint8Array(BLOCK);
  if(key.length>BLOCK) key=_sha256(key);
  k.set(key);
  const ipad=new Uint8Array(BLOCK), opad=new Uint8Array(BLOCK);
  for(let i=0;i<BLOCK;i++){ ipad[i]=k[i]^0x36; opad[i]=k[i]^0x5c; }
  const inner=new Uint8Array(BLOCK+data.length); inner.set(ipad); inner.set(data,BLOCK);
  const outer=new Uint8Array(BLOCK+BLOCK); outer.set(opad); outer.set(_sha256(inner),BLOCK);
  return _sha256(outer);
}
async function signQuery(query,secret){
  const msg=new TextEncoder().encode(query), key=new TextEncoder().encode(secret);
  if(window.crypto&&crypto.subtle){
    try{
      const ko=await crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
      const sig=await crypto.subtle.sign("HMAC",ko,msg);
      return _bytesToHex(new Uint8Array(sig));
    }catch(e){}
  }
  return _bytesToHex(_hmac(key,msg));
}

/* ============ 时间同步 ============ */
let serverRefMs=0, serverRefPerf=0, syncOk=false;
async function ensureOffset(){
  if(syncOk && performance.now()-serverRefPerf<60000) return;
  try{
    const r=await fetch(API+"/fapi/v1/time");
    const d=await r.json();
    const ms=Number(d.serverTime);
    if(ms>0){ serverRefMs=ms; serverRefPerf=performance.now(); syncOk=true; return; }
  }catch(e){}
  syncOk=false;
}
async function nowMs(){
  await ensureOffset();
  return serverRefMs>0 ? Math.round(serverRefMs+(performance.now()-serverRefPerf)) : Date.now();
}

/* ============ 签名请求 ============ */
async function signedFetch(acc, path, method, params){
  const all=Object.assign({timestamp:await nowMs(), recvWindow:10000}, params||{});
  const qs=Object.keys(all).sort().map(k=>k+"="+encodeURIComponent(all[k])).join("&");
  const sig=await signQuery(qs, acc.secret);
  const opts={headers:{"X-MBX-APIKEY":acc.key}};
  if(method==="POST") opts.headers["Content-Type"]="application/x-www-form-urlencoded";
  const r=await fetch(API+path+"?"+qs+"&signature="+sig, Object.assign({method:method||"GET"}, opts));
  return await r.json();
}
function setStatus(t){ document.getElementById("status").textContent=t; }

/* ============ 行情缓存（价格全量 + 最小数量） ============ */
let PRICE_MAP={}, MINQ_MAP={}, STEP_MAP={}, NOTIONAL_MAP={}, EXINFO_T=0;
async function loadMarket(){
  if(Date.now()-EXINFO_T<300000 && Object.keys(PRICE_MAP).length) return;
  try{
    const [px, ex]=await Promise.all([
      fetch(API+"/fapi/v1/ticker/price").then(r=>r.json()),
      fetch(API+"/fapi/v1/exchangeInfo").then(r=>r.json())
    ]);
    const pm={};
    (px||[]).forEach(p=>{ pm[p.symbol]=parseFloat(p.price); });
    const mq={}, st={}, nt={};
    (ex.symbols||[]).forEach(s=>{
      const f=(s.filters||[]).find(x=>x.filterType==="LOT_SIZE");
      const n=(s.filters||[]).find(x=>x.filterType==="MIN_NOTIONAL");
      if(f){ mq[s.symbol]=String(f.minQty); st[s.symbol]=String(f.stepSize); }
      if(n&&n.notional) nt[s.symbol]=parseFloat(n.notional);
    });
    PRICE_MAP=pm; MINQ_MAP=mq; STEP_MAP=st; NOTIONAL_MAP=nt; EXINFO_T=Date.now();
  }catch(e){}
}

/* ============ 操作记录 ============ */
function getLogs(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); }catch(e){ return []; } }
function addLog(type, text){
  const logs=getLogs();
  logs.unshift({t:Date.now(), type, text});
  if(logs.length>50) logs.length=50;
  try{ localStorage.setItem(LOG_KEY, JSON.stringify(logs)); }catch(e){}
  renderLog();
}
function renderLog(){
  const logs=getLogs().slice(0,1);
  const el=document.getElementById("opLog");
  if(!logs.length){ el.innerHTML='<div class="oplog-empty">暂无操作记录</div>'; return; }
  el.innerHTML=logs.map(l=>{
    const d=new Date(l.t);
    const hm=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
    return '<div class="oplog-item '+l.type+'">'+hm+' '+esc(l.text)+'</div>';
  }).join("");
}

/* ============ 加载：每账户无仓位的交易对 ============ */
async function loadAll(){
  const accs=loadAcc();
  if(!accs.length){
    document.getElementById("cards").innerHTML='<tr><td colspan="6" class="empty"><div class="big">尚未添加账户</div>点击「设置账户」填入 API Key。</td></tr>';
    setStatus("");
    return;
  }
  setStatus("正在加载持仓…");
  await loadMarket();
  const results=await Promise.all(accs.map(async acc=>{
    try{
      const rows=await signedFetch(acc,"/fapi/v2/positionRisk");
      if(rows.code===401 || rows.code===-2014) throw new Error("API Key 无效或权限不足（-2014）");
      if(!Array.isArray(rows)) throw new Error("接口异常："+(rows.msg||JSON.stringify(rows).slice(0,80)));
      const held={};
      rows.forEach(p=>{ if(p.positionAmt && parseFloat(p.positionAmt)!==0) held[p.symbol]=true; });
      return {acc, held, err:null};
    }catch(e){ return {acc, held:{}, err:e.message}; }
  }));
  renderCards(accs, results);
}
function renderCards(accs, results){
  const el=document.getElementById("cards");
  const rows=[];
  accs.forEach((a,i)=>{
    const r=results[i];
    if(r.err){
      rows.push('<tr><td><span class="acct-name">'+esc(a.name)+'</span></td><td colspan="5" style="text-align:left;color:#e05c53">✗ 失败：'+esc(r.err)+'</td></tr>');
      return;
    }
    const empty=PAIRS.filter(s=>!r.held[s]);
    empty.forEach(s=>{
      const price=PRICE_MAP[s];
      const mq=MINQ_MAP[s];
      const minUsd=(price&&mq)?Math.max(price*parseFloat(mq), (NOTIONAL_MAP[s]||5)+1):null;
      rows.push('<tr><td><span class="acct-name">'+esc(a.name)+'</span></td><td class="sym">'+esc(s)+'</td><td class="side-long">多</td>'+
        '<td class="num">'+(minUsd?minUsd.toLocaleString("en-US",{maximumFractionDigits:4})+" USDT":"—")+'</td>'+
        '<td>—</td>'+
        '<td><button class="op-btn" onclick="openOrder('+a.id+',\''+s+'\')">开多</button></td></tr>');
    });
  });
  el.innerHTML=rows.join('')||'<tr><td colspan="6" class="empty"><div class="big">暂无数据</div>点击「刷新数据」加载持仓。</td></tr>';
  const errs=results.filter(r=>r.err);
  const cnts=results.map((r,i)=>esc(accs[i].name)+(r.err?(" ✗ "+esc(r.err)):(" ✓ "+PAIRS.filter(s=>!r.held[s]).length+" 个无仓位"))).join("  ·  ");
  setStatus((errs.length?(errs.length+" 个账户失败；"):"")+cnts);
}

/* ============ 下单：最小开仓数量 ============ */
let PENDING=null;
async function openOrder(accId, sym){
  const acc=loadAcc().find(x=>x.id===accId);
  if(!acc) return;
  const mq=MINQ_MAP[sym];
  const price=PRICE_MAP[sym];
  if(!mq||!isFinite(price)){ alert("未获取到该交易对信息，请刷新数据后重试"); return; }
  const usd=Math.max(price*parseFloat(mq), (NOTIONAL_MAP[sym]||5)+1);
  PENDING={acc,sym,usd,price};
  document.getElementById("ordBody").innerHTML=
    '<div>账户：<b>'+esc(acc.name)+'</b></div>'+
    '<div>交易对：<b>'+esc(sym)+'</b></div>'+
    '<div>操作：<b>开仓（多单 BUY）</b>，金额 <b>'+usd.toLocaleString("en-US",{maximumFractionDigits:4})+' USDT</b></div>'+
    '<div>约数量：约 <b>'+usd.toLocaleString("en-US",{maximumFractionDigits:6})+'/'+price.toLocaleString("en-US",{maximumFractionDigits:6})+' = '+ (usd/price).toLocaleString("en-US",{maximumFractionDigits:4})+'</b> 个（按最新价折算）</div>'+
    '<div>类型：市价单，按 USDT 金额执行</div>'+
    '<div class="ord-warn">请确认账户余额充足。市价单可能产生滑点，成交后自动刷新。</div>';
  document.getElementById("ordMask").classList.add("open");
}
function closeOrder(){ document.getElementById("ordMask").classList.remove("open"); }
async function placeOrder(){
  const t=PENDING;
  if(!t) return;
  closeOrder();
  PENDING=null;
  try{
    const dualJ=await signedFetch(t.acc,"/fapi/v1/positionSide/dual");
    const dual=!!dualJ.dualSidePosition;
    // 按数量下单（与 us-position-web 开仓逻辑一致）：部分交易对不接受 quoteOrderQty 金额市价单
    const step=parseFloat(STEP_MAP[t.sym]||"1");
    const minQ=parseFloat(MINQ_MAP[t.sym]||"1");
    const minN=NOTIONAL_MAP[t.sym]||5;
    let qty=Math.floor((t.usd/t.price)/step)*step;         // 向下取整到最小步长
    qty=Math.round(qty*1e8)/1e8;                           // 固定 8 位精度舍入
    if(qty*t.price<minN){                                  // 金额不足最小名义值时向上补齐
      qty=Math.ceil((minN/t.price)/step)*step;
      qty=Math.round(qty*1e8)/1e8;
    }
    if(qty<minQ) qty=minQ;
    const qtyStr=String(qty);
    const params={symbol:t.sym, side:"BUY", type:"MARKET", quantity:qtyStr, newOrderRespType:"ACK"};
    if(dual) params.positionSide="LONG";
    const j=await signedFetch(t.acc,"/fapi/v1/order","POST",params);
    if(j.orderId){
      addLog("ok", t.acc.name+" "+t.sym+" 开仓多单 "+qtyStr+" 个 ≈ "+t.usd.toLocaleString("en-US",{maximumFractionDigits:4})+" USDT（订单 "+j.orderId+"）");
      setStatus(t.acc.name+" "+t.sym+" 开仓成功（订单 "+j.orderId+"）");
      loadAll();
    }else{
      addLog("err", t.acc.name+" "+t.sym+" 开仓失败："+(j.msg||JSON.stringify(j).slice(0,120)));
      alert("开仓失败："+(j.msg||JSON.stringify(j).slice(0,120)));
    }
  }catch(e){
    addLog("err", t.acc.name+" "+t.sym+" 开仓失败："+e.message);
    alert("开仓失败："+e.message);
  }
}

/* ============ 设置账户 ============ */
function rowHtml(nm,key,secret){
  return '<div class="arow">'+
    '<input class="nm" value="'+esc(nm)+'" placeholder="账户名">'+
    '<input class="ak" value="'+esc(key)+'" placeholder="API Key" autocomplete="off">'+
    '<input class="as" value="'+esc(secret)+'" placeholder="API Secret" autocomplete="off" type="password">'+
    '<button class="del" onclick="this.parentNode.remove()" title="删除该账户">×</button></div>';
}
function openSet(){
  const accs=loadAcc();
  document.getElementById("accRows").innerHTML = accs.length
    ? accs.map(a=>rowHtml(a.name,a.key,a.secret)).join("")
    : rowHtml("账户1","","");
  document.getElementById("mask").classList.add("open");
}
function closeSet(){ document.getElementById("mask").classList.remove("open"); }
function addRow(){
  const n=document.getElementById("accRows").children.length;
  document.getElementById("accRows").insertAdjacentHTML("beforeend", rowHtml("账户"+(n+1),"",""));
}
function saveSet(){
  const accs=[];
  document.querySelectorAll("#accRows .arow").forEach(row=>{
    const key=row.querySelector(".ak").value.trim();
    const secret=row.querySelector(".as").value.trim();
    if(!key&&!secret) return;
    const nm=(row.querySelector(".nm").value||"").trim()||("账户"+(accs.length+1));
    accs.push({id:Date.now()+accs.length, name:nm, key, secret});
  });
  if(!accs.length){ alert("请至少填写一行 API Key + Secret"); return; }
  saveAcc(accs);
  closeSet();
  loadAll();
}

loadAll();
renderLog();
